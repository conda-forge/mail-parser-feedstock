schema_version: 1

context:
  name: mail-parser
  version: "4.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 2099f2620462342effe87aea7c6062cb87ddf8bdd05f1f718d5315d4476a4b75

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  python:
    entry_points:
      - mailparser = mailparser.__main__:main

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - simplejson >=3.17.0
    - six >=1.14.0

tests:
  - python:
      imports:
        - mailparser
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - mailparser --help

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Tokenizer for raw mails
  description: |
    mail-parser is not only a wrapper for email Python Standard Library.
    It give you an easy way to pass from raw mail to Python object that
    you can use in your code.
  homepage: https://github.com/SpamScope/mail-parser
  repository: https://github.com/SpamScope/mail-parser
  documentation: https://github.com/SpamScope/mail-parser

extra:
  recipe-maintainers:
    - jan-janssen
